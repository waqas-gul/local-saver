# CI for pull requests and pushes to main (08 §7.2, 09 §7).
# Deploy workflows (deploy-staging.yml, release.yml) are added once hosting is decided (SP-01, DEC-022).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test

jobs:
  checks:
    name: Typecheck, lint, unit and component tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Dependency audit (fail on high or critical)
        run: pnpm audit --audit-level high

  stack:
    # Everything that needs the local stack: Supabase (Postgres, Auth, Realtime) and RustFS
    # standing in for R2 (phase 1 DV1-4).
    name: Database, API integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the local stack (applies migrations and seed)
        run: pnpm stack:start
      - name: pgTAP tests
        run: pnpm exec supabase test db
      - name: Generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code lib/server/db/types.gen.ts
      - run: pnpm build
      - name: API integration tests (T-001 … T-049, IDOR matrix, Realtime)
        run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: E2E (Phase 0 smoke and Phase 1 multi-device)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
