allowBuilds:
  sharp: false
  unrs-resolver: false

# Security overrides for transitive dependencies (phase 1 F1-6). Each fixed version is past
# pnpm's minimum release age; review when the parent packages update their ranges.
overrides:
  # postcss → source-map-js: event-loop DoS below 1.2.2
  source-map-js: ^1.2.2
  # shadcn CLI (dev) → MCP SDK: OAuth credential leak below 1.31.0
  '@modelcontextprotocol/sdk': ^1.32.0
  # next (optional, never built or run: images.unoptimized) → sharp: librsvg CVE below 0.35.5
  sharp: ^0.35.5
# Audit exceptions (phase 1 F1-6). Remove each once a fixed release exists.
auditConfig:
  ignoreGhsas:
    # braces: DoS through deeply nested glob patterns. No fixed release. Reached only through dev
    # tooling (eslint-config-next, shadcn CLI, kysely-codegen) reading patterns from config files,
    # never from user input; not in the server or browser bundle.
    - GHSA-vfj7-8cjw-p6xm
